# The chart values the showcase installs Pagerless with. platform/apps renders
# the pagerless Application with this file through the Argo CD `$values` source.
#
# The pin in platform/apps/templates/pagerless.yaml is the released v2 chart,
# 2.0.0. v2 is standalone: the chart creates the server, its Page history and its
# read-only cluster identity, with no database, identity provider, executor,
# agent gateway or admission webhook. These keys are that chart's.

rbac:
  # The showcase is one demo cluster. Cluster-wide read gives the watcher the
  # demo's Targets and the Node conditions, and keeps /openapi/v3 validation
  # available to a Proposal.
  watchAllNamespaces: true

auth:
  mode: token
  adminSecret:
    # Argo CD renders the chart with `helm template`, where `lookup` cannot see
    # the live Secret and a generated bootstrap token would rotate on every sync.
    # hack/bootstrap-stack.sh creates pagerless-admin-secret out of band instead.
    create: false

credentials:
  # One Secret, one key per credential: AI_BASE_URL, AI_API_KEY, AI_MODEL,
  # GITHUB_TOKEN, GITHUB_REPO, optional GITHUB_API_URL, and the per-sender
  # webhook keys (ALERTMANAGER_WEBHOOK_TOKEN and the optional Grafana, Datadog
  # and generic credentials). hack/bootstrap-stack.sh creates it from .env, and
  # values/pagerless-secrets.example.yaml documents its shape. Pagerless never
  # writes a cluster credential into it.
  existingSecret: pagerless-credentials
  secretName: pagerless-credentials

persistence:
  # The append-only Page history, which survives a server restart.
  size: 1Gi

dashboard:
  # The Portal is reached with `kubectl port-forward`, so the cookie is scoped
  # to localhost and is not marked Secure.
  baseUrl: http://localhost:8080
