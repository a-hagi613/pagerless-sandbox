# The Secrets the v2 chart reads, with the keys each one must carry and no
# values. hack/bootstrap-stack.sh creates pagerless-credentials,
# pagerless-admin-secret and the monitoring copy of pagerless-alertmanager from
# .env before the pagerless Application syncs; the chart creates the session key
# on its first sync. This file documents the shape for an operator who creates
# them another way.
#
# Nothing here is applied by Argo CD, and no value belongs in Git: apply a copy
# with `kubectl apply -f` only after filling it in, or create the Secrets from a
# secret manager.
apiVersion: v1
kind: Secret
metadata:
  name: pagerless-credentials
  namespace: pagerless
type: Opaque
stringData:
  # Any OpenAI-compatible endpoint: OpenAI, DeepSeek, Ollama, vLLM, OpenRouter,
  # a Gemini compatibility endpoint, or the showcase's own in-cluster gateway.
  # The sandbox's .env points these at platform/model-gateway:
  #   AI_BASE_URL=http://model-gateway.pagerless.svc.cluster.local:4000/v1
  #   AI_MODEL=bedrock/us.amazon.nova-2-lite-v1:0
  #   AI_API_KEY=<any non-empty value; the gateway runs without a master key>
  # A gateway URL is not privileged: the product works with any endpoint.
  AI_BASE_URL: ""
  AI_API_KEY: ""
  AI_MODEL: ""
  # The token Pagerless uses to open the pull request that carries a Proposal.
  # A fine-grained token with Contents: write, Pull requests: write and
  # Metadata: read on the Target Repository.
  GITHUB_TOKEN: ""
  # owner/name of the Target Repository, for example
  # a-hagi613/pagerless-sandbox.
  GITHUB_REPO: ""
  # Optional. Set it only for GitHub Enterprise; github.com uses the default.
  GITHUB_API_URL: "https://api.github.com"
  # Per-sender webhook credentials. Alertmanager is the showcase's sender; a
  # dialect whose key is empty is refused rather than accepted unauthenticated.
  # Grafana uses the HMAC-SHA256 secret, the other two use a bearer token.
  ALERTMANAGER_WEBHOOK_TOKEN: ""
  GRAFANA_WEBHOOK_SECRET: ""
  DATADOG_WEBHOOK_TOKEN: ""
  GENERIC_WEBHOOK_TOKEN: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: pagerless-admin-secret
  namespace: pagerless
type: Opaque
stringData:
  # The bootstrap token the Portal exchanges for a session, and the same token
  # `kubectl page config set` accepts. The chart does not render it, because
  # Argo CD cannot preserve a generated value across syncs.
  token: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: pagerless-session-key
  namespace: pagerless
type: Opaque
stringData:
  # The HMAC-SHA256 key that signs session cookies. The chart creates it on the
  # first sync and Argo CD ignores later differences, so a sync never signs
  # every browser out.
  key: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: pagerless-alertmanager
  namespace: monitoring
type: Opaque
stringData:
  # Alertmanager's copy of the ALERTMANAGER_WEBHOOK_TOKEN value in the
  # credentials Secret. The same value must be present in both places; the
  # bootstrap writes both from one generated token.
  token: ""
