# The Secrets the pinned chart reads, with the keys each one must carry and no
# values. hack/bootstrap-stack.sh creates all four in the pagerless namespace
# from .env before the pagerless Application syncs, and this file documents the
# shape for an operator who creates them another way.
#
# Nothing here is applied by Argo CD, and no value belongs in Git: apply a copy
# with `kubectl apply -f` only after filling it in, or create the Secrets from a
# secret manager.
apiVersion: v1
kind: Secret
metadata:
  name: github-read
  namespace: pagerless
type: Opaque
stringData:
  # A fine-grained token with Contents: read on the Sandbox repository.
  token: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: github-write
  namespace: pagerless
type: Opaque
stringData:
  # A fine-grained token with Contents: write, Pull requests: write and
  # Metadata: read on the Sandbox repository (ADR-0015).
  token: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: argocd-read
  namespace: pagerless
type: Opaque
stringData:
  # An Argo CD API token with read access to the sandbox Application.
  token: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: pagerless-alertmanager
  namespace: pagerless
type: Opaque
stringData:
  # The bearer token every Alertmanager delivery must carry. The same value is
  # mounted into Alertmanager from this Secret.
  token: ""
