# The identity the gateway's AWS client runs as. Its only AWS permission comes
# from infra/model_gateway.tf: EKS Pod Identity matches this namespace and this
# ServiceAccount name, so the pod receives short-lived Bedrock credentials and no
# key is stored in the cluster. The account itself needs no RBAC.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: model-gateway
  namespace: pagerless
  labels:
    app.kubernetes.io/name: model-gateway
    app.kubernetes.io/part-of: pagerless-sandbox
