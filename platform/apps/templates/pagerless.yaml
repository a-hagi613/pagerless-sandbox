apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pagerless
  namespace: argocd
spec:
  project: default
  sources:
    # The product as a released artefact, never as source. The chart is
    # oci://ghcr.io/a-hagi613/charts/pagerless, pinned to the released 2.0.0.
    # Argo CD takes the registry and its namespace in repoURL and the chart name
    # in chart; the oci:// scheme belongs to the artefact reference, not to this
    # field. The chart is standalone and needs no platform service beside it.
    - repoURL: ghcr.io/a-hagi613/charts
      chart: pagerless
      targetRevision: 2.0.0
      helm:
        releaseName: pagerless
        valueFiles:
          - $values/values/pagerless.yaml
    - repoURL: {{ required "platform.repoURL is required" .Values.platform.repoURL | quote }}
      targetRevision: {{ required "platform.targetRevision is required" .Values.platform.targetRevision | quote }}
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: pagerless
  # Argo CD renders the chart with `helm template`, where the chart's `lookup`
  # cannot see the live Secret and would mint a new session key on every render.
  # The first sync creates the key; later syncs must not sign every browser out.
  ignoreDifferences:
    - kind: Secret
      name: pagerless-session-key
      namespace: pagerless
      jsonPointers:
        - /data
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 20
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
