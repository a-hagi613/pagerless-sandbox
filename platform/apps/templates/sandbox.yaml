apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sandbox
  namespace: argocd
spec:
  project: default
  source:
    repoURL: {{ required "sandbox.repoURL is required" .Values.sandbox.repoURL | quote }}
    targetRevision: {{ required "sandbox.targetRevision is required" .Values.sandbox.targetRevision | quote }}
    path: workloads
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: sandbox
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
