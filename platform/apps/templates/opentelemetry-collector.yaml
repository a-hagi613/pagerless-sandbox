apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: opentelemetry-collector
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://open-telemetry.github.io/opentelemetry-helm-charts
      chart: opentelemetry-collector
      targetRevision: 0.178.3
      helm:
        releaseName: opentelemetry-collector
        valueFiles:
          - $values/platform/observability/opentelemetry-collector/values.yaml
    - repoURL: {{ required "platform.repoURL is required" .Values.platform.repoURL | quote }}
      targetRevision: {{ required "platform.targetRevision is required" .Values.platform.targetRevision | quote }}
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
