apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://grafana-community.github.io/helm-charts
      chart: loki
      targetRevision: 21.3.0
      helm:
        releaseName: loki
        valueFiles:
          - $values/platform/observability/loki/values.yaml
    - repoURL: {{ required "platform.repoURL is required" .Values.platform.repoURL | quote }}
      targetRevision: {{ required "platform.targetRevision is required" .Values.platform.targetRevision | quote }}
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
