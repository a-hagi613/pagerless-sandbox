apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observability-dashboards
  namespace: argocd
spec:
  project: default
  source:
    repoURL: {{ required "platform.repoURL is required" .Values.platform.repoURL | quote }}
    targetRevision: {{ required "platform.targetRevision is required" .Values.platform.targetRevision | quote }}
    path: platform/observability/dashboards
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
