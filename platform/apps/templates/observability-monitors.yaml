apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observability-monitors
  namespace: argocd
spec:
  project: default
  source:
    repoURL: {{ required "platform.repoURL is required" .Values.platform.repoURL | quote }}
    targetRevision: {{ required "platform.targetRevision is required" .Values.platform.targetRevision | quote }}
    path: platform/observability/monitors
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    # The ServiceMonitor kind exists only after kube-prometheus-stack installs its CRDs.
    retry:
      limit: 20
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
