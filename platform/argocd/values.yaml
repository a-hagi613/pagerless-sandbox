# Values for the argo-cd chart 10.18.0 (Argo CD v3.6.1), used by hack/bootstrap-stack.sh.
# The reconciliation interval is shortened so a merged commit reaches the demo
# within seconds. The jitter is removed so the interval is exact.
configs:
  cm:
    timeout.reconciliation: 10s
    timeout.reconciliation.jitter: 0s
  params:
    server.insecure: true

# The showcase uses the Argo CD API and controllers only. SSO, notifications,
# and ApplicationSets are not needed for the local or EKS loop.
dex:
  enabled: false
notifications:
  enabled: false
applicationSet:
  enabled: false
