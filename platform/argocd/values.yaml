# Values for the argo-cd chart 10.18.0 (Argo CD v3.6.1), used by hack/bootstrap-stack.sh.
# The reconciliation interval is shortened so that merged Sandbox commits sync
# within seconds (spec #1). The jitter is removed so the interval is exact.
configs:
  cm:
    accounts.pagerless: apiKey
    accounts.pagerless.enabled: "true"
    timeout.reconciliation: 10s
    timeout.reconciliation.jitter: 0s
  params:
    server.insecure: true
  rbac:
    policy.default: role:pagerless-none
    policy.csv: |
      p, role:pagerless-read, applications, get, default/sandbox, allow
      g, pagerless, role:pagerless-read

# Phase 1 uses only the Argo CD API and controllers. SSO, notifications, and
# ApplicationSets are not needed for the local loop.
dex:
  enabled: false
notifications:
  enabled: false
applicationSet:
  enabled: false
