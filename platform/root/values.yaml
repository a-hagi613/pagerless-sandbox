# Rendered by hack/bootstrap-stack.sh, which sets every value with --set. The
# defaults point at the main branch of this repository, which holds both the
# platform's child Applications and the Sandbox Targets.
platform:
  repoURL: https://github.com/a-hagi613/pagerless-sandbox
  targetRevision: main

# The repository whose workloads/ directory the sandbox Application syncs. It is
# this repository unless the showcase runs against a fork, which is why
# hack/bootstrap-stack.sh passes SANDBOX_URL instead of relying on the default.
sandbox:
  repoURL: ""
  targetRevision: main
