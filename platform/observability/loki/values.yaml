# Values for the loki chart 21.3.0 from the grafana-community repository, in
# single-binary mode. Read by the Argo CD Application in platform/apps/templates.
deploymentMode: Monolithic

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h

singleBinary:
  replicas: 1
  persistence:
    size: 2Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

# The simple scalable targets are disabled, because the monolithic target runs every component.
write:
  replicas: 0
read:
  replicas: 0
backend:
  replicas: 0

# The local stack reaches Loki directly, so the gateway and the memcached caches,
# which need more memory than the local stack has, are not deployed.
gateway:
  enabled: false
resultsCache:
  enabled: false
chunksCache:
  enabled: false
lokiCanary:
  enabled: false
test:
  enabled: false
