apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: pagerless-oomkilled
  namespace: monitoring
spec:
  groups:
    - name: pagerless.workloads
      rules:
        # kube-state-metrics reports the pod that was OOMKilled, not its Workload. The
        # expression joins the pod to its owner: a Deployment through its ReplicaSet, or a
        # StatefulSet directly. The receiver of pagerless-server reads the deployment or
        # statefulset label, and the namespace and pod labels, from this alert.
        - alert: ContainerOOMKilled
          expr: |
            (
              max by (namespace, pod, deployment) (
                max by (namespace, pod, owner_name) (
                  kube_pod_owner{owner_kind="ReplicaSet"}
                )
                * on (namespace, owner_name) group_left (deployment)
                max by (namespace, owner_name, deployment) (
                  label_replace(
                    label_replace(
                      kube_replicaset_owner{owner_kind="Deployment"},
                      "deployment", "$1", "owner_name", "(.+)"
                    ),
                    "owner_name", "$1", "replicaset", "(.+)"
                  )
                )
              )
              or
              max by (namespace, pod, statefulset) (
                label_replace(
                  kube_pod_owner{owner_kind="StatefulSet"},
                  "statefulset", "$1", "owner_name", "(.+)"
                )
              )
            )
            * on (namespace, pod) group_left ()
            max by (namespace, pod) (
              kube_pod_container_status_last_terminated_reason{reason="OOMKilled"}
            )
          labels:
            severity: warning
            pagerless_triage: "true"
          annotations:
            summary: A container of a Workload was OOMKilled.
            description: The container of pod {{ $labels.namespace }}/{{ $labels.pod }} was terminated with reason OOMKilled.
