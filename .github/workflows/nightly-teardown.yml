name: Nightly teardown

# Destroys any EKS session that a session left behind. It authenticates with a
# short-lived OIDC token, so no AWS key is stored in GitHub, and it is safe to
# run when nothing exists: an empty state destroys nothing.
#
# A session must not span 03:17 UTC. `make cloud-down` is still the normal end
# of a session; this is the backstop for the one that was forgotten.
#
# `workflow_dispatch` exists so the coordinator can prove this path against a
# session that is deliberately left standing, instead of waiting for 03:17 UTC.
# The concurrency group below keeps a manual run from overlapping a scheduled
# one, so only one destroy can ever be in flight.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

# A manual run and the scheduled run must not destroy at the same time.
concurrency:
  group: nightly-teardown
  cancel-in-progress: false

jobs:
  destroy:
    name: Destroy the stack and check for leftovers
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aws-actions/configure-aws-credentials@ec61189d14ec14c8efccab744f656cffd0e33f37 # v6.1.0
        with:
          role-to-assume: arn:aws:iam::207567775100:role/pagerless-github-destroy
          role-session-name: pagerless-nightly-destroy
          aws-region: us-east-1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.2
          terraform_wrapper: false
      - name: Destroy the stack
        working-directory: infra
        run: |
          set -euo pipefail
          terraform init -input=false
          terraform destroy -input=false -auto-approve -no-color
      # The zero-residue check fails on anything that survives, and the destroy
      # above cannot see either kind of Karpenter resource: its `instant` EC2
      # fleet and the IAM instance profile it creates per node launch are outside
      # Terraform's state. A live teardown left exactly that pair behind. The
      # Karpenter sweep runs before the volume sweep because deleting a fleet
      # terminates the instances that would otherwise keep a volume in use.
      - name: Sweep the Karpenter fleets and instance profiles
        run: |
          set -euo pipefail
          bash hack/cloud-karpenter-sweep.sh
      # The zero-residue check fails on any EBS volume that survives, and the
      # sweep is the only step in this workflow that can delete one: a volume the
      # CSI driver created is outside Terraform's state, so the destroy above
      # never sees it. The sweep therefore runs first, in the same order
      # `hack/cloud-down.sh` uses, so the check proves zero rather than
      # discovering a volume the next step would have removed.
      - name: Sweep the EBS volumes the destroy cannot see
        run: |
          set -euo pipefail
          bash hack/cloud-volume-sweep.sh
      - name: Confirm that nothing billable remains
        run: |
          set -euo pipefail
          bash hack/cloud-teardown-check.sh
