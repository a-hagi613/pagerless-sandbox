name: kubeconform

# Validates every manifest in the repository: the rendered demo Targets, the
# platform's plain objects, the two platform charts as Helm renders them, the
# CPU-stress experiment, and every Scenario patch against the Target it
# changes. The patch check is what keeps `make break` from becoming a silent
# no-op, so this job is also the required status check on main.

# `make reset` force-pushes main to the known-good tag, so a push to main is not
# always a commit that carries this workflow or the files it validates. The pull
# request is what CI checks; main is re-validated by the next pull request.
on:
  pull_request:

permissions:
  contents: read

jobs:
  kubeconform:
    name: kubeconform
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install kubeconform v0.8.0
        run: |
          curl -fsSLO https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz
          echo "9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883  kubeconform-linux-amd64.tar.gz" | sha256sum --check --strict
          tar -xzf kubeconform-linux-amd64.tar.gz kubeconform
          sudo install -m 0755 kubeconform /usr/local/bin/kubeconform
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          # The same Helm the README pins, so a rendering difference is a
          # difference in the manifests rather than in the tool.
          version: v4.3.2
      - name: Lint the shell and Python sources
        run: make lint
      - name: Validate the manifests, the experiment and every Scenario patch
        run: bash hack/validate.sh
      - name: Install the pinned render dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet --requirement hack/requirements.txt
      - name: Check the inventory, namespaces and annotations
        run: .venv/bin/python hack/check.py
