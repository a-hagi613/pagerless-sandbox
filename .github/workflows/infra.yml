name: Infrastructure

# The free half of the showcase's test plan: formatting, validation and linting
# of every Terraform configuration, plus a read-only plan of the stack through a
# keyless OIDC role. Nothing here applies, and nothing stores an AWS key.
#
# The plan job runs only for pull requests from this repository, so a fork
# cannot borrow the role. There is no push trigger: the changes that touch
# infra/ arrive as pull requests, and `make reset` pushes a restore commit that
# changes only the demo tree.

on:
  pull_request:
    paths:
      - "infra/**"
      - "hack/**"
      - ".github/workflows/infra.yml"

permissions:
  contents: read

jobs:
  terraform:
    name: Terraform format, validation and lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The teardown scripts run no paid command and need no credentials: their
      # tests put a fake `aws` on PATH. They must run where the scripts change,
      # so a check that silently passes on an error cannot return.
      - name: Check the teardown scripts
        run: |
          set -euo pipefail
          bash hack/cloud-down-order-check.sh
          bash hack/cloud-down-context-test.sh
          bash hack/cloud-karpenter-sweep-test.sh
          bash hack/cloud-teardown-check-test.sh
          bash hack/cloud-volume-sweep-test.sh
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.2
          terraform_wrapper: false
      - name: Check formatting
        working-directory: infra
        run: terraform fmt -check -recursive
      - name: Validate the state bootstrap
        working-directory: infra/bootstrap
        run: |
          set -euo pipefail
          terraform init -backend=false -input=false
          terraform validate
      - name: Validate the CI identity
        working-directory: infra/ci
        run: |
          set -euo pipefail
          terraform init -backend=false -input=false
          terraform validate
      - name: Validate the stack
        working-directory: infra
        run: |
          set -euo pipefail
          terraform init -backend=false -input=false
          terraform validate
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: v0.66.0
      - name: Lint
        working-directory: infra
        env:
          # tflint downloads its AWS ruleset from GitHub releases. Without a
          # token the download shares the runner's anonymous rate limit and the
          # job fails before it lints anything.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tflint --init
          tflint --recursive

  plan:
    name: Read-only plan
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aws-actions/configure-aws-credentials@ec61189d14ec14c8efccab744f656cffd0e33f37 # v6.1.0
        with:
          role-to-assume: arn:aws:iam::207567775100:role/pagerless-github-plan
          role-session-name: pagerless-plan
          aws-region: us-east-1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.2
          terraform_wrapper: false
      - name: Plan
        working-directory: infra
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          COMMIT: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # The plan role may not write to the state bucket, so the plan does not
          # take the state lock. It only reads.
          terraform init -input=false -lock=false
          terraform plan -input=false -lock=false -no-color 2>&1 | tee plan.txt

          {
            echo "### Terraform plan"
            echo
            echo '```'
            head -c 60000 plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          {
            echo "Read-only \`terraform plan\` of \`infra/\` at \`${COMMIT:0:7}\`, through the \`pagerless-github-plan\` role. Nothing is applied."
            echo
            echo "<details><summary>terraform plan</summary>"
            echo
            echo '```'
            head -c 60000 plan.txt
            echo '```'
            echo
            echo "</details>"
          } > comment.md
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file comment.md
